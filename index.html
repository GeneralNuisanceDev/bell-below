<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bell Below</title><style>
*{box-sizing:border-box}body{margin:0;background:#031616;display:grid;place-items:center;min-height:100vh;min-height:100dvh;color:#f8e9b9}canvas{touch-action:none;display:block;width:min(100vw,46.20853vh);width:min(100vw,46.20853dvh);height:auto;outline-offset:-3px}canvas:focus:not(:focus-visible){outline:none}
</style></head><body><canvas width="390" height="844" tabindex="0" aria-label="Bell Below. Aim at a numbered shell and release to fire. Keyboard: left and right aim, space fires, 1 to 3 choose upgrades, M toggles sound."></canvas>
<script>
'use strict';
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const W=390,H=844,LEFT=16,RIGHT=374,TOP=132,DECK=691,ORIGIN={x:195,y:738},DT=1/120;
const cream='#f8edc8', mint='#a7f0cc', coral='#ff9c74', brass='#e8bd68', dim='#709e91';
const fittings=[
 {id:'fork',name:'Forked tongue',detail:'Cast one extra echo per shot.'},
 {id:'chime',name:'Heavy chime',detail:'Every impact deals one more damage.'},
 {id:'arc',name:'Live wire',detail:'A broken shell strikes its nearest neighbour.'},
 {id:'drift',name:'Long echo',detail:'Keep each echo in the water longer.'},
 {id:'pearl',name:'Pearl diver',detail:'Increase the value of chained hits.'}
];
let game,manual=false,acc=0,held=false,livePoint={x:.5,y:.32},lastTime=0,audio,muted=false;
function rng(){let x=game.seed;x^=x<<13;x^=x>>>17;x^=x<<5;game.seed=x>>>0;return game.seed/4294967296}
function tint(k){return [mint,brass,coral][k%3]}
function stage(){
 const g=game;g.phase='aim';g.turn=0;g.shells=[];g.balls=[];g.combo=0;g.peak=0;g.angle=-Math.PI/2;
 const count=Math.min(14,4+g.wave), slots=[0,1,2,3,4];
 for(let i=0;i<count;i++){
  if(i%5===0){for(let j=4;j>0;j--){const k=Math.floor(rng()*(j+1));[slots[j],slots[k]]=[slots[k],slots[j]]}}
  const row=Math.floor(i/5), col=slots[i%5], hp=1+Math.floor((g.wave-1)/3)+((i+g.wave)%4===0?1:0);
  g.shells.push({x:57+col*69,y:300-row*67+(col%2)*14,hp,kind:(col+row+g.wave)%3,r:25,wink:0})
 }
}
function reset(seed){game={seed:(seed>>>0)||0x9e3779b9,initialSeed:seed>>>0,phase:'aim',wave:1,score:0,turn:0,combo:0,peak:0,revived:false,
 upgrades:{fork:0,chime:0,arc:0,drift:0,pearl:0},cards:[],shells:[],balls:[],bits:[],clock:0,freeze:0,shake:0,angle:-Math.PI/2};acc=0;held=false;stage();draw()}
function aim(x,y){const px=x*W-ORIGIN.x,py=Math.min(-25,y*H-ORIGIN.y);return Math.max(-2.91,Math.min(-.23,Math.atan2(py,px)))}
function tone(f,d,shape='sine',gain=.055){if(!audio||muted||audio.state!=='running'||manual)return;const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime;
 o.type=shape;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.64,t+d);v.gain.setValueAtTime(gain,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+d)}
function wake(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio?.state==='suspended')audio.resume().catch(()=>{})}
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=rng()*Math.PI*2,s=32+130*rng();game.bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.24+rng()*.37,color})}}
function cast(){const g=game;if(g.phase!=='aim')return;g.phase='flight';g.turn++;g.combo=0;g.peak=0;const count=Math.min(7,1+g.upgrades.fork);
 for(let i=0;i<count;i++){const a=g.angle+(i-(count-1)/2)*.084;g.balls.push({x:ORIGIN.x,y:ORIGIN.y-13,vx:Math.cos(a)*620,vy:Math.sin(a)*620,life:3.5+g.upgrades.drift*.55,tail:[]})}tone(300,.23)}
function damage(s,d,chain=true){if(!s||s.hp<=0)return;const g=game;s.hp-=d;s.wink=.12;g.combo++;g.peak=Math.max(g.peak,g.combo);g.score+=10*g.combo*(1+g.upgrades.pearl);
 const broken=s.hp<=0;burst(s.x,s.y,tint(s.kind),broken?14:6);g.freeze=.026;g.shake=broken?4:2;tone(310+Math.min(g.combo,12)*54,.13);
 if(broken&&chain&&g.upgrades.arc){const nearest=g.shells.filter(q=>q.hp>0).sort((a,b)=>Math.hypot(a.x-s.x,a.y-s.y)-Math.hypot(b.x-s.x,b.y-s.y))[0];if(nearest)damage(nearest,g.upgrades.arc,false)}
}
function draft(){const g=game;g.phase='draft';g.balls=[];g.score+=50*g.wave;
 const pool=[...fittings];g.cards=[];while(g.cards.length<3){g.cards.push(pool.splice(Math.floor(rng()*pool.length),1)[0])}tone(770,.35)}
function pick(i){if(game.phase!=='draft'||!Number.isInteger(i)||i<0||i>2)return;
 game.upgrades[game.cards[i].id]++;game.wave++;stage();tone(520,.27)}
function revive(){const g=game;if(g.phase!=='revive')return;g.revived=true;const front=Math.max(...g.shells.map(s=>s.y));
 for(const s of g.shells){if(s.y>=front-32){burst(s.x,s.y,brass,10);s.hp=0}else s.y=Math.max(TOP+32,s.y-95)}
 g.shells=g.shells.filter(s=>s.hp>0);g.phase='aim';g.combo=0;if(!g.shells.length)draft();tone(690,.4)}
function endCast(){const g=game;const drop=30+Math.min(15,g.wave);for(const s of g.shells)s.y+=drop;
 g.phase=g.shells.some(s=>s.y+s.r>=DECK)?(g.revived?'over':'revive'):'aim';if(g.phase==='over'||g.phase==='revive')tone(95,.6)}
function tick(dt){const g=game;g.clock+=dt;g.shake=Math.max(0,g.shake-dt*15);
 for(const p of g.bits){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=85*dt;p.t-=dt}g.bits=g.bits.filter(p=>p.t>0);
 for(const s of g.shells)s.wink=Math.max(0,s.wink-dt);
 if(g.freeze>0){g.freeze-=dt;return}if(g.phase!=='flight')return;
 for(const b of g.balls){
  b.life-=dt;b.tail.push([b.x,b.y]);if(b.tail.length>9)b.tail.shift();
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<LEFT+5){b.x=LEFT+5;b.vx=Math.abs(b.vx)}if(b.x>RIGHT-5){b.x=RIGHT-5;b.vx=-Math.abs(b.vx)}
  if(b.y<TOP+5){b.y=TOP+5;b.vy=Math.abs(b.vy)}
  for(const s of g.shells){if(s.hp<=0)continue;const dx=b.x-s.x,dy=b.y-s.y,dist=Math.hypot(dx,dy),r=s.r+5;if(dist>=r||dist<.0001)continue;
   const nx=dx/dist,ny=dy/dist,dot=b.vx*nx+b.vy*ny;b.x=s.x+nx*(r+.2);b.y=s.y+ny*(r+.2);
   if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;damage(s,1+g.upgrades.chime)}break
  }
 }
 g.shells=g.shells.filter(s=>s.hp>0);g.balls=g.balls.filter(b=>b.life>0&&b.y<ORIGIN.y+15);
 if(!g.shells.length)draft();else if(!g.balls.length)endCast()
}
function advance(ms,input={}){const g=game,down=!!input.down,release=!!input.tap||(held&&!down),x=Number.isFinite(input.x)?input.x:.5,y=Number.isFinite(input.y)?input.y:.4;
 if(g.phase==='aim'){if(down||release)g.angle=aim(x,y);if(release)cast()}
 else if(g.phase==='draft'){const i=input.choice;if(Number.isInteger(i))pick(i)}
 else if(g.phase==='revive'&&release)revive();else if(g.phase==='over'&&release)reset(g.initialSeed);
 held=down;acc+=Math.max(0,Math.min(Number(ms)||0,1000))/1000;while(acc+1e-10>=DT){tick(DT);acc-=DT}draw()}
function state(){const g=game;return {phase:g.phase,wave:g.wave,score:g.score,entities:g.shells.length+g.balls.length,combo:g.combo,game_over:g.phase==='over',awaiting_revive:g.phase==='revive'}}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function ring(x,y,r,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}
function dot(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function label(value,x,y,size,color=cream,align='left',style='mono'){ctx.fillStyle=color;ctx.textAlign=align;ctx.font=(style==='title'?'bold ':style==='num'?'bold ':'')+size+'px '+(style==='title'?'Georgia,serif':style==='num'?'system-ui,sans-serif':'monospace');ctx.fillText(value,x,y)}
function shell(s){const c=tint(s.kind);ctx.save();ctx.translate(s.x,s.y);ctx.strokeStyle=c;ctx.fillStyle=s.wink?'#688c72':['#20453d','#393e2d','#443c33'][s.kind];ctx.lineWidth=2;
 ctx.beginPath();const n=[8,6,12][s.kind];for(let i=0;i<n;i++){const a=2*Math.PI*i/n-Math.PI/2,r=(s.kind===2&&i%2?22:26);if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ring(0,0,17,c+'80');label(s.hp,0,7,19,cream,'center','num');ctx.restore()}
function waters(t){
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#112e31');bg.addColorStop(.62,'#092d32');bg.addColorStop(1,'#061c22');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.beginPath();ctx.rect(LEFT,TOP,RIGHT-LEFT,DECK-TOP);ctx.clip();
 for(let r=76;r<710;r+=78)ring(195,DECK+24,r,'#34616852');
 for(let i=-4;i<=4;i++)line(195,DECK+24,195+i*153,TOP-30,'#34616850');
 for(let i=0;i<32;i++){const x=24+(i*109)%342,y=TOP+((i*73-t*(5+i%7))%550+550)%550;dot(x,y,i%4===0?1.6:.8,'#63939180')}
 for(let i=0;i<4;i++){ctx.beginPath();for(let x=LEFT;x<=RIGHT;x+=4){const y=TOP+28+i*9+10*Math.sin(x*.032+i*.7)+6*Math.sin(x*.087+i);if(x===LEFT)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='#4d77735c';ctx.lineWidth=1;ctx.stroke()}
 ctx.restore();for(let y=TOP;y<DECK;y+=13){const wide=(y-TOP)%65===0?8:4;line(LEFT,y,LEFT+wide,y,dim);line(RIGHT-wide,y,RIGHT,y,dim)}line(LEFT,TOP,RIGHT,TOP,'#718e7c');line(LEFT,DECK,RIGHT,DECK,coral)
}
function drawAim(){const a=game.angle;let x=ORIGIN.x,y=ORIGIN.y,vx=Math.cos(a),vy=Math.sin(a);
 for(let i=0;i<22;i++){x+=vx*14;y+=vy*14;if(x<LEFT+5){x=2*(LEFT+5)-x;vx=-vx}if(x>RIGHT-5){x=2*(RIGHT-5)-x;vx=-vx}dot(x,y,1.8,mint+Math.max(40,187-i*6).toString(16).padStart(2,'0'))}}
function overlay(){const g=game;ctx.fillStyle='#061b20f4';ctx.fillRect(22,258,346,g.phase==='draft'?338:239);line(22,258,368,258,brass,2);
 if(g.phase==='draft'){label('WAVE '+String(g.wave).padStart(2,'0')+' CLEARED',43,292,12,mint);label('Fit the bell',42,335,36,cream,'left','title');
 g.cards.forEach((c,i)=>{const y=357+i*74;ctx.fillStyle='#163739';ctx.fillRect(37,y,316,64);label(String(i+1),51,y+37,19,brass,'left','title');label(c.name,82,y+25,20,cream,'left','title');label(c.detail,82,y+46,10,mint)});return}
 const again=g.phase==='revive';label(again?'EMERGENCY AIR':'DIVE LOG',43,292,12,brass);label(again?'Cable breached':'Last sounding',42,342,34,cream,'left','title');
 label(again?'Blow the front row clear.':'Wave '+g.wave+'    /    '+g.score+' points',43,376,14,mint);
 ctx.fillStyle=brass;ctx.fillRect(40,410,310,54);label(again?'TAP TO VENT   +   CONTINUE':'TAP TO DIVE AGAIN',195,442,15,'#113032','center')}
function draw(){const g=game;waters(g.clock);label('B E L L   B E L O W',22,48,27,cream,'left','title');line(21,66,369,66,'#4e756d');
 label('WAVE',22,91,11,dim);label(String(g.wave).padStart(2,'0'),22,120,28,cream,'left','title');label('SALVAGE',104,91,11,dim);label(String(g.score).padStart(4,'0'),104,120,28,brass,'left','title');
 label('ECHO',286,91,11,dim);label('×'+g.combo,286,119,24,mint,'left','title');
 ctx.save();ctx.translate(Math.sin(g.clock*99)*g.shake,Math.cos(g.clock*116)*g.shake*.7);
 if(g.phase==='aim')drawAim();for(const s of g.shells)shell(s);
 for(const b of g.balls){b.tail.forEach(([x,y],i)=>dot(x,y,1+i*.32,'#cceab77a'));dot(b.x,b.y,5,cream);ring(b.x,b.y,9,mint+'64')}
 for(const p of g.bits){ctx.globalAlpha=Math.min(1,p.t*3);dot(p.x,p.y,2,p.color)}ctx.globalAlpha=1;ctx.restore();
 ctx.fillStyle='#132e30';ctx.fillRect(15,DECK+12,360,74);line(16,DECK+86,374,DECK+86,'#55746a');
 ring(195,ORIGIN.y,26,'#6a8f7f',2);ring(195,ORIGIN.y,20,brass,2);line(195,ORIGIN.y,195+Math.cos(g.angle)*31,ORIGIN.y+Math.sin(g.angle)*31,brass,7);dot(195,ORIGIN.y,8,'#e5d9a5');
 label('DEPTH',27,728,10,dim);label((g.wave*40)+' m',27,752,17,mint);label('HULL',347,728,10,dim,'right');label(g.revived?'LAST LIFE':'1 VENT',347,752,14,g.revived?coral:mint,'right');
 label(g.phase==='flight'?'ECHO IN WATER':g.phase==='aim'?'DRAG TO AIM   ·   RELEASE TO RING':'',178,810,12,cream,'center');label(muted?'OFF':'SND',351,810,11,dim,'center');
 if(['draft','revive','over'].includes(g.phase))overlay()
}
function localPos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
let gesture=false,gesturePhase='';
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||manual)return;wake();canvas.focus();livePoint=localPos(e);
 if(livePoint.y>.93&&livePoint.x>.83){muted=!muted;draw();return}gesture=true;gesturePhase=game.phase;canvas.setPointerCapture(e.pointerId);if(game.phase==='aim')advance(0,{...livePoint,down:true})});
canvas.addEventListener('pointermove',e=>{if(!gesture||manual||!e.isPrimary)return;livePoint=localPos(e);if(game.phase==='aim')advance(0,{...livePoint,down:true})});
canvas.addEventListener('pointercancel',()=>{gesture=false;held=false});
canvas.addEventListener('pointerup',e=>{if(!gesture||manual||!e.isPrimary)return;gesture=false;livePoint=localPos(e);if(game.phase!==gesturePhase){held=false;return}if(game.phase==='draft'){const y=livePoint.y*H-357,i=Math.floor(y/74);if(livePoint.x*W>=37&&livePoint.x*W<=353&&y>=0&&y%74<=64)pick(i)}else advance(0,{...livePoint,tap:true});draw()});
canvas.addEventListener('keydown',e=>{if(manual||e.repeat)return;wake();if(e.key==='m'||e.key==='M')muted=!muted;
 else if(game.phase==='draft'&&/^[123]$/.test(e.key))pick(Number(e.key)-1);
 else if(game.phase==='aim'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();game.angle=Math.max(-2.91,Math.min(-.23,game.angle+(e.key==='ArrowLeft'?-.095:.095)))}
 else if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(game.phase==='aim')cast();else if(game.phase==='revive')revive();else if(game.phase==='over')reset(game.initialSeed)}draw()});
window.__GAME={reset(seed){manual=true;reset(seed)},step:advance,state};
reset(Date.now()>>>0);
function frame(t){if(!manual){const dt=lastTime?Math.min(50,t-lastTime):0;acc+=dt/1000;while(acc>=DT){tick(DT);acc-=DT}draw()}lastTime=t;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
